<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Disable Vite dev HMR WebSocket inside AI Studio iframe preview
      (function() {
        try {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1))) {
                var target = new EventTarget();
                target.readyState = 3; // CLOSED
                target.send = function() {};
                target.close = function() {};
                target.onopen = null;
                target.onclose = null;
                target.onerror = null;
                target.onmessage = null;
                return target;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
          }
        } catch (e) {}

        // Intercept and swallow uncaught Vite HMR errors so they don't break the UI
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).toLowerCase().indexOf('websocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = String(event && (event.message || event.error) || '').toLowerCase();
          if (msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
